name: Test FastAPI Serving Layer

on:
  push:
    branches: [ main ]
    paths:
      - 'serving/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install fastapi uvicorn pydantic joblib scikit-learn numpy pytest httpx

      - name: Run API tests
        run: pytest serving/test_main.py -v
